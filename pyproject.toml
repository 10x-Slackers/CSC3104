[project]
name = "csc3104"
version = "0.1.0"
description = "CSC3104 Cloud and Distributed Computing workspace"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["apps/*"]

[dependency-groups]
dev = [
    "grpcio-tools>=1.84.1",
    "httpx2>=2.13.1,<2.14",
    "pre-commit>=4",
    "pytest>=8.4",
    "pyyaml>=6.0.3",
    "ruff>=0.14",
]

[tool.pytest]
testpaths = ["apps"]

[tool.ruff]
src = ["apps/*/src", "apps/*/tests"]
extend-exclude = ["*_pb2.py", "*_pb2.pyi", "*_pb2_grpc.py"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "RUF100"]
