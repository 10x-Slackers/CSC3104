[project]
name = "csc3104"
version = "0.1.0"
description = "CSC3104 Cloud and Distributed Computing workspace"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["apps/*"]

[dependency-groups]
dev = [
    "grpcio-tools>=1.84.1",
    "httpx2>=2.13.1,<2.14",
    "pre-commit>=4",
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.ruff]
extend-exclude = ["*_pb2.py", "*_pb2.pyi", "*_pb2_grpc.py"]
