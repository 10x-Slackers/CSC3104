[project]
name = "csc3104"
version = "0.1.0"
description = "CSC3104 Cloud and Distributed Computing workspace"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["apps/*"]
exclude = ["apps/.gitkeep"]

[tool.pytest.ini_options]
# The optional persistent cache cannot be shared across Windows accounts.
addopts = ["-p", "no:cacheprovider"]
testpaths = ["apps"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
]
