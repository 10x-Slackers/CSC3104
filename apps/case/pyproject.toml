[project]
name = "case"
version = "0.1.0"
description = "Role 5: bank-local cases, alerts, analyst UI and draft reports"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "privacy-node",
    "python-multipart>=0.0.32",
    "security",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
privacy-node = { workspace = true }
security = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
