[project]
name = "scorer"
version = "0.1.0"
description = "Role 2: bank-local forwarding detection and Kafka streaming"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.6",
    "ingestor",
    "security",
    "valkey>=6.2",
]

[tool.uv.sources]
ingestor = { workspace = true }
security = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
