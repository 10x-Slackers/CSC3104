[project]
name = "privacy-node"
version = "0.1.0"
description = "Role 3: peer-to-peer chain tracing over gRPC with signed link claims"
requires-python = ">=3.12"
dependencies = ["grpcio>=1.84.1", "protobuf>=7.35.1", "scorer", "security"]

[tool.uv.sources]
scorer = { workspace = true }
security = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
