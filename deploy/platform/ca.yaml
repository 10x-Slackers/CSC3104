# Laboratory CA for privacy-node mTLS: a self-signed root that signs every bank's certificates.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bank-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: csc3104-bank-ca
  secretName: bank-ca
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: bank-ca
spec:
  ca:
    secretName: bank-ca
