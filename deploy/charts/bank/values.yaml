# Which bank this release is: A, B or C.
bank: A
# Run with replicas: Kafka 3 brokers (a write needs 2 of them), PostgreSQL 3 instances
# with automatic failover, privacy node 2. Set it on a fresh bank, not a running one.
ha: false
# The one image every service runs (the root Dockerfile).
image:
  repository: mulechain
  tag: dev
# Addresses of the Kubernetes API server, which bank pods may reach. Looked up from the
# cluster when empty; set it only to render the chart without a cluster (CI).
apiServerCIDRs: []
# AWS only (from Terraform): this bank's ElastiCache and Lambdas. When set, the bank
# runs no ingestor, summary or Valkey pods of its own.
#   valkeyUrl, valkeyCidrs, summaryUrl, vpcCidr, kafkaNodePort
aws: {}
