# Kubernetes API server addresses that bank pods may reach (CloudNativePG instances need the API).
# k3d-up.sh pins the k3d node network to 172.28.0.0/16; 10.43.0.1 is k3s's `kubernetes` Service.
apiServerCIDRs: [172.28.0.0/16, 10.43.0.1/32]

# Off by default so the base platform installs without the privacy node image or keys.
# Enable with: --set privacyNode.enabled=true (see deploy/privacy-node-up.sh)
privacyNode:
  enabled: false
  image: privacy-node:dev
  workload: apps/dataset/fixtures/tiny  # built into the image for M2
  keyVersion: k1
