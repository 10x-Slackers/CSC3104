# This release's bank: A, B or C (install.sh sets it per namespace).
bank: A
# Images built from the root Dockerfile, one per service: <repository>/<package>:<tag>.
image:
  repository: csc3104
  tag: dev
# Kubernetes API server addresses that bank pods may reach (CloudNativePG instances need the API).
# k3d-up.sh pins the k3d node network to 172.28.0.0/16; 10.43.0.1 is k3s's `kubernetes` Service. eks-up.sh sets EKS's.
apiServerCIDRs: [172.28.0.0/16, 10.43.0.1/32]
