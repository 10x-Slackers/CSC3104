# This release's bank: A, B or C (install.sh sets it per namespace).
bank: A
# High availability: Kafka 3 brokers with min.insync.replicas 2, PostgreSQL 3 instances, privacy node 2 replicas.
ha: false
# Images built from the root Dockerfile, one per service: <repository>/<package>:<tag>.
image:
  repository: csc3104
  tag: dev
# Kubernetes API server addresses that bank pods may reach (CloudNativePG instances need the API). install.sh looks them up.
apiServerCIDRs: []
# EKS only: each bank's AWS endpoints from Terraform's bank_values output, keyed by bank (eks-up.sh sets it).
# A bank found here uses ElastiCache and the summary Lambda, and the ingestor Lambda produces through a Kafka
# VPC listener; without it (k3d) the ingestor, summary service and Valkey run in the bank.
aws: {}
