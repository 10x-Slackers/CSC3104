# Bank-local detection: the only Kafka consumer, writing state to Valkey; KEDA scales it on lag.
{{- $bank := .Values.bank }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scorer
spec:
  selector:
    matchLabels: {app: scorer}
  template:
    metadata:
      labels: {app: scorer}
    spec:
      {{- include "bank.pod" . | nindent 6 }}
      containers:
        - name: scorer
          image: {{ .Values.image.repository }}/scorer:{{ .Values.image.tag }}
          args: [python, -m, scorer.stream]
          env:  # docs/contracts/deployment.md, Scorer row
            - {name: SCORER_BANK, value: {{ $bank }}}
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: "kafka-kafka-bootstrap:9092"}
            - {name: VALKEY_URL, value: "valkey://valkey:6379"}
            - {name: KEY_DIR, value: /keys}  # every version in <bank>/active.json
          volumeMounts:
            - {name: keys, mountPath: /keys}
          {{- include "bank.container" . | nindent 10 }}
      volumes:
        - {{- include "bank.keyVolume" (list . "{active.json,private/x25519/**,trusted/x25519/**}") | nindent 10 }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: scorer
spec:
  scaleTargetRef:
    name: scorer
  minReplicaCount: 1
  maxReplicaCount: 6
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-kafka-bootstrap.{{ .Release.Namespace }}.svc:9092
        consumerGroup: scorer-{{ $bank }}
        topic: bank-{{ $bank }}-transactions
        lagThreshold: "100"
        offsetResetPolicy: earliest
