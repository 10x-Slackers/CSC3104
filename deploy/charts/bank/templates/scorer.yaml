# Scorer: the bank's only Kafka consumer. It applies the rules and writes state to Valkey.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scorer
spec:
  selector:
    matchLabels: {app: scorer}
  template:
    metadata:
      labels: {app: scorer}
    spec:
      {{- include "bank.pod" . | nindent 6 }}
      containers:
        - name: scorer
          image: {{ include "bank.image" . }}
          args: [python, -m, mulechain.scorer]
          env:
            - {name: BANK, value: {{ .Values.bank }}}
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: kafka-kafka-bootstrap:9092}
            - {name: VALKEY_URL, value: {{ include "bank.valkeyUrl" . | quote }}}
            - {name: KEY_DIR, value: /keys}
          volumeMounts:
            - {name: keys, mountPath: /keys}
          {{- include "bank.container" . | nindent 10 }}
      volumes:
        - name: keys
          secret: {secretName: bank-keys}
---
# Autoscaling on consumer lag (KEDA): one more worker per 100 events waiting, up to one
# per partition. Workers share nothing: Kafka gives each a share of the partitions.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: scorer
spec:
  scaleTargetRef:
    name: scorer
  minReplicaCount: 1
  maxReplicaCount: 6
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-kafka-bootstrap.{{ .Release.Namespace }}.svc:9092
        consumerGroup: scorer-{{ .Values.bank }}
        topic: bank-{{ .Values.bank }}-transactions
        lagThreshold: "100"
        offsetResetPolicy: earliest
