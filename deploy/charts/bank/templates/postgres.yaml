# PostgreSQL (CloudNativePG): the privacy node's store and the case store. Service
# postgres-rw:5432 always points at the primary; with `ha` there are two streaming
# replicas and automatic failover. Credentials are in the Secret postgres-app.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: {{ ternary 3 1 .Values.ha }}
  storage:
    size: 1Gi
