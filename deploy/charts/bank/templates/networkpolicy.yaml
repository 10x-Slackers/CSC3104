# Deny everything, then allow DNS and the Kubernetes API. Each path inside the bank is allowed below at both ends, never
# by a broad egress rule, which k3s would apply to inbound traffic too (docs/contracts/deployment.md).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bank-baseline
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        {{- range required "apiServerCIDRs: an empty list would allow every address" (.Values.apiServerCIDRs | default "") }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}
---
# Kafka: its own pods (brokers and topic operator, which also talk to each other) and the Strimzi operator on any port;
# the ingestor, the scorer and KEDA (reads consumer lag) on the plain listener only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-clients
spec:
  podSelector: {matchLabels: {strimzi.io/cluster: kafka}}
  policyTypes: [Ingress, Egress]
  egress: [{to: [{podSelector: {matchLabels: {strimzi.io/cluster: kafka}}}]}]
  ingress:
    - from:
        - podSelector: {matchLabels: {strimzi.io/cluster: kafka}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: strimzi}}
    - from:
        - podSelector: {matchExpressions: [{key: app, operator: In, values: [ingestor, scorer]}]}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: keda}}
      ports: [{protocol: TCP, port: 9092}]
---
# PostgreSQL: its own instances (replication, both ways) and the CloudNativePG operator on any port; the privacy node
# and the case service on 5432 only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-clients
spec:
  podSelector: {matchLabels: {cnpg.io/cluster: postgres}}
  policyTypes: [Ingress, Egress]
  egress: [{to: [{podSelector: {matchLabels: {cnpg.io/cluster: postgres}}}]}]
  ingress:
    - from:
        - podSelector: {matchLabels: {cnpg.io/cluster: postgres}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cnpg-system}}
    - from:
        - podSelector: {matchExpressions: [{key: app, operator: In, values: [privacy-node, case]}]}
      ports: [{protocol: TCP, port: 5432}]
---
# The privacy node -> this bank's case service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: node-to-case
spec:
  podSelector: {matchLabels: {app: case}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: privacy-node}}
      ports: [{protocol: TCP, port: 8000}]
---
# The client end of each path above. Valkey and summary pods run on k3d only; on EKS these rules match nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingestor-egress
spec:
  podSelector: {matchLabels: {app: ingestor}}
  policyTypes: [Egress]
  egress:
    - {to: [{podSelector: {matchLabels: {strimzi.io/cluster: kafka}}}], ports: [{protocol: TCP, port: 9092}]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scorer-egress
spec:
  podSelector: {matchLabels: {app: scorer}}
  policyTypes: [Egress]
  egress:
    - {to: [{podSelector: {matchLabels: {strimzi.io/cluster: kafka}}}], ports: [{protocol: TCP, port: 9092}]}
    - {to: [{podSelector: {matchLabels: {app: valkey}}}], ports: [{protocol: TCP, port: 6379}]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: privacy-node-egress
spec:
  podSelector: {matchLabels: {app: privacy-node}}
  policyTypes: [Egress]
  egress:
    - {to: [{podSelector: {matchLabels: {app: valkey}}}], ports: [{protocol: TCP, port: 6379}]}
    - {to: [{podSelector: {matchLabels: {cnpg.io/cluster: postgres}}}], ports: [{protocol: TCP, port: 5432}]}
    - {to: [{podSelector: {matchLabels: {app: case}}}], ports: [{protocol: TCP, port: 8000}]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: case-egress
spec:
  podSelector: {matchLabels: {app: case}}
  policyTypes: [Egress]
  egress:
    - {to: [{podSelector: {matchLabels: {cnpg.io/cluster: postgres}}}], ports: [{protocol: TCP, port: 5432}]}
    - {to: [{podSelector: {matchLabels: {app: summary}}}], ports: [{protocol: TCP, port: 8080}]}
---
# Privacy node <-> the other banks' privacy nodes, gRPC port only (docs/contracts/security.md).
{{- $peers := without (list "bank-a" "bank-b" "bank-c") .Release.Namespace | toJson }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: privacy-node-peers
spec:
  podSelector: {matchLabels: {app: privacy-node}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions: [{key: kubernetes.io/metadata.name, operator: In, values: {{ $peers }}}]
          podSelector:
            matchLabels: {app: privacy-node}
      ports: [{protocol: TCP, port: 50051}]
  egress:
    - to:
        - namespaceSelector:
            matchExpressions: [{key: kubernetes.io/metadata.name, operator: In, values: {{ $peers }}}]
          podSelector:
            matchLabels: {app: privacy-node}
      ports: [{protocol: TCP, port: 50051}]
{{- with get .Values.aws .Values.bank }}
---
# EKS: the ingestor Lambda -> Kafka's VPC listener. A NetworkPolicy can't name the Lambda's security group, so this
# admits the whole VPC, pods included: Kafka is no longer namespace-private on EKS (docs/contracts/deployment.md).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lambda-to-kafka
spec:
  podSelector: {matchLabels: {strimzi.io/broker-role: "true"}}
  policyTypes: [Ingress]
  ingress:
    - from: [{ipBlock: {cidr: {{ .vpcCidr }}}}]
      ports: [{protocol: TCP, port: 9094}]
---
# EKS: the scorer and privacy node -> this bank's ElastiCache, in its own subnets (deploy/terraform/cache.tf).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey-clients
spec:
  podSelector:
    matchExpressions: [{key: app, operator: In, values: [scorer, privacy-node]}]
  policyTypes: [Egress]
  egress:
    - to:
        {{- range required "aws.<bank>.valkeyCidrs: an empty list would allow every address" (.valkeyCidrs | default "") }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports: [{protocol: TCP, port: 6379}]
---
# EKS: the case service -> the summary Lambda's function URL over HTTPS, signed as LabRole taken from the node's
# metadata service. That hands this pod the whole role: an accepted limitation of the lab account.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: case-to-summary
spec:
  podSelector: {matchLabels: {app: case}}
  policyTypes: [Egress]
  egress:
    - to: [{ipBlock: {cidr: 0.0.0.0/0, except: [{{ .vpcCidr }}]}}]
      ports: [{protocol: TCP, port: 443}]
    - to: [{ipBlock: {cidr: 169.254.169.254/32}}]
      ports: [{protocol: TCP, port: 80}]
{{- else }}
---
# k3d: the scorer and privacy node -> this bank's Valkey pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey-clients
spec:
  podSelector: {matchLabels: {app: valkey}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchExpressions: [{key: app, operator: In, values: [scorer, privacy-node]}]}
      ports: [{protocol: TCP, port: 6379}]
---
# k3d: the case service -> this bank's summary pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: case-to-summary
spec:
  podSelector: {matchLabels: {app: summary}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: case}}
      ports: [{protocol: TCP, port: 8080}]
---
# k3d: the replay Job (replay namespace) -> this bank's ingestor, HTTP port only (docs/contracts/deployment.md).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: replay-to-ingestor
spec:
  podSelector: {matchLabels: {app: ingestor}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: replay}}
      ports: [{protocol: TCP, port: 8080}]
{{- end }}
