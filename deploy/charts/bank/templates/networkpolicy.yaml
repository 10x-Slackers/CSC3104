# Zero trust inside the cluster: every bank pod starts with no network access at all, and
# each path a service needs is then allowed by name, at both ends (the client may send,
# the server may receive). Nothing is opened by a broad rule.
#
# The paths, per bank:   replay -> ingestor -> kafka <- scorer -> valkey <- privacy-node
#                        privacy-node -> postgres <- case -> summary;  privacy-node -> case
#                        privacy-node <-> the other banks' privacy nodes
{{- $api := .Values.apiServerCIDRs }}
{{- if not $api }}
  {{- with lookup "v1" "Service" "default" "kubernetes" }}
    {{- $api = append $api (printf "%s/32" .spec.clusterIP) }}
  {{- end }}
  {{- range (lookup "discovery.k8s.io/v1" "EndpointSlice" "default" "kubernetes").endpoints }}
    {{- $api = append $api (printf "%s/32" (first .addresses)) }}
  {{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bank-baseline  # deny everything; allow only DNS and the Kubernetes API server
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:  # the operators' pods (Kafka, PostgreSQL) need the API; an empty list would allow every address
        {{- range required "no API server address found: set apiServerCIDRs" $api }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka  # brokers talk to each other and their operator; clients get the plain listener only
spec:
  podSelector: {matchLabels: {strimzi.io/cluster: kafka}}
  policyTypes: [Ingress, Egress]
  egress: [{to: [{podSelector: {matchLabels: {strimzi.io/cluster: kafka}}}]}]
  ingress:
    - from:
        - podSelector: {matchLabels: {strimzi.io/cluster: kafka}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: strimzi}}
    - from:
        - podSelector: {matchExpressions: [{key: app, operator: In, values: [ingestor, scorer]}]}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: keda}}  # reads consumer lag
      ports: [{protocol: TCP, port: 9092}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres  # instances replicate to each other and answer their operator; clients get 5432 only
spec:
  podSelector: {matchLabels: {cnpg.io/cluster: postgres}}
  policyTypes: [Ingress, Egress]
  egress: [{to: [{podSelector: {matchLabels: {cnpg.io/cluster: postgres}}}]}]
  ingress:
    - from:
        - podSelector: {matchLabels: {cnpg.io/cluster: postgres}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cnpg-system}}
    - from:
        - podSelector: {matchExpressions: [{key: app, operator: In, values: [privacy-node, case]}]}
      ports: [{protocol: TCP, port: 5432}]
---
{{- if not .Values.aws }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingestor
spec:
  podSelector: {matchLabels: {app: ingestor}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: replay}}}]
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - {to: [{podSelector: {matchLabels: {strimzi.io/cluster: kafka}}}], ports: [{protocol: TCP, port: 9092}]}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scorer
spec:
  podSelector: {matchLabels: {app: scorer}}
  policyTypes: [Egress]
  egress:
    - {to: [{podSelector: {matchLabels: {strimzi.io/cluster: kafka}}}], ports: [{protocol: TCP, port: 9092}]}
    - {to: [{podSelector: {matchLabels: {app: valkey}}}], ports: [{protocol: TCP, port: 6379}]}
---
{{- if not .Values.aws }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey
spec:
  podSelector: {matchLabels: {app: valkey}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchExpressions: [{key: app, operator: In, values: [scorer, privacy-node]}]}}]
      ports: [{protocol: TCP, port: 6379}]
{{- end }}
---
# The privacy node: its own bank's Valkey, PostgreSQL and case service, and the other
# banks' privacy nodes on the gRPC port, both ways. Not a node in its own bank, and
# nothing else in another bank.
{{- $peers := without (list "bank-a" "bank-b" "bank-c") .Release.Namespace | toJson }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: privacy-node
spec:
  podSelector: {matchLabels: {app: privacy-node}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchExpressions: [{key: kubernetes.io/metadata.name, operator: In, values: {{ $peers }}}]}
          podSelector: {matchLabels: {app: privacy-node}}
      ports: [{protocol: TCP, port: 50051}]
  egress:
    - to:
        - namespaceSelector: {matchExpressions: [{key: kubernetes.io/metadata.name, operator: In, values: {{ $peers }}}]}
          podSelector: {matchLabels: {app: privacy-node}}
      ports: [{protocol: TCP, port: 50051}]
    - {to: [{podSelector: {matchLabels: {app: valkey}}}], ports: [{protocol: TCP, port: 6379}]}
    - {to: [{podSelector: {matchLabels: {cnpg.io/cluster: postgres}}}], ports: [{protocol: TCP, port: 5432}]}
    - {to: [{podSelector: {matchLabels: {app: case}}}], ports: [{protocol: TCP, port: 8000}]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: case
spec:
  podSelector: {matchLabels: {app: case}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: privacy-node}}}]
      ports: [{protocol: TCP, port: 8000}]
  egress:
    - {to: [{podSelector: {matchLabels: {cnpg.io/cluster: postgres}}}], ports: [{protocol: TCP, port: 5432}]}
    - {to: [{podSelector: {matchLabels: {app: summary}}}], ports: [{protocol: TCP, port: 8080}]}
---
{{- if not .Values.aws }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: summary
spec:
  podSelector: {matchLabels: {app: summary}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: case}}}]
      ports: [{protocol: TCP, port: 8080}]
{{- end }}
{{- with .Values.aws }}
---
# AWS: the ingestor Lambda -> Kafka's VPC listener. A NetworkPolicy can't name the
# Lambda's security group, so this admits the whole VPC; the security group in
# deploy/terraform/lambda.tf is what limits each Lambda to its own bank's ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lambda-to-kafka
spec:
  podSelector: {matchLabels: {strimzi.io/broker-role: "true"}}
  policyTypes: [Ingress]
  ingress:
    - from: [{ipBlock: {cidr: {{ .vpcCidr }}}}]
      ports: [{protocol: TCP, port: 9094}]
---
# AWS: the scorer and privacy node -> this bank's ElastiCache, which has subnets of its own.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: elasticache
spec:
  podSelector: {matchExpressions: [{key: app, operator: In, values: [scorer, privacy-node]}]}
  policyTypes: [Egress]
  egress:
    - to:
        {{- range required "aws.valkeyCidrs: an empty list would allow every address" .valkeyCidrs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports: [{protocol: TCP, port: 6379}]
---
# AWS: the case service -> the summary Lambda's function URL over HTTPS, signed with the
# role it takes from the node's metadata service (the lab account has no per-pod roles).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: summary-lambda
spec:
  podSelector: {matchLabels: {app: case}}
  policyTypes: [Egress]
  egress:
    - to: [{ipBlock: {cidr: 0.0.0.0/0, except: [{{ .vpcCidr }}]}}]
      ports: [{protocol: TCP, port: 443}]
    - to: [{ipBlock: {cidr: 169.254.169.254/32}}]
      ports: [{protocol: TCP, port: 80}]
{{- end }}
