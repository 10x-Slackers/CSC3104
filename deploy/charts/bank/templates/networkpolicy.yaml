# Deny everything, then allow: traffic inside this bank, DNS, the Kubernetes API, and the platform operators.
# TODO: narrow to per-service paths and add privacy node <-> other banks (docs/contracts/security.md).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bank-baseline
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [strimzi, cnpg-system]
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}
