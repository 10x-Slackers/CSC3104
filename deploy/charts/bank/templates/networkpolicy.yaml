# Deny everything, then allow: traffic inside this bank, DNS, the Kubernetes API, and the platform operators (KEDA reads Kafka lag).
# TODO: narrow to per-service paths and add privacy node <-> other banks (docs/contracts/security.md).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bank-baseline
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [strimzi, cnpg-system, keda]
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        {{- range .Values.apiServerCIDRs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}
---
# Privacy node <-> the other banks' privacy nodes, gRPC port only (docs/contracts/security.md).
# Listing its own namespace changes nothing: the baseline already allows traffic inside the bank.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: privacy-node-peers
spec:
  podSelector:
    matchLabels: {app: privacy-node}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions: [{key: kubernetes.io/metadata.name, operator: In, values: [bank-a, bank-b, bank-c]}]
          podSelector:
            matchLabels: {app: privacy-node}
      ports: [{protocol: TCP, port: 50051}]
  egress:
    - to:
        - namespaceSelector:
            matchExpressions: [{key: kubernetes.io/metadata.name, operator: In, values: [bank-a, bank-b, bank-c]}]
          podSelector:
            matchLabels: {app: privacy-node}
      ports: [{protocol: TCP, port: 50051}]
{{- with get .Values.aws .Values.bank }}
---
# EKS: the ingestor Lambda -> Kafka's VPC listener. A NetworkPolicy can't name the Lambda's security group, so this
# admits the whole VPC, pods included: Kafka is no longer namespace-private on EKS (docs/contracts/deployment.md).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lambda-to-kafka
spec:
  podSelector:
    matchLabels: {strimzi.io/broker-role: "true"}
  policyTypes: [Ingress]
  ingress:
    - from: [{ipBlock: {cidr: {{ .vpcCidr }}}}]
      ports: [{protocol: TCP, port: 9094}]
---
# EKS: the scorer and privacy node -> this bank's ElastiCache, in its own subnets (deploy/terraform/cache.tf).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey-clients
spec:
  podSelector:
    matchExpressions: [{key: app, operator: In, values: [scorer, privacy-node]}]
  policyTypes: [Egress]
  egress:
    - to:
        {{- range .valkeyCidrs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports: [{protocol: TCP, port: 6379}]
---
# EKS: the case service -> the summary Lambda's function URL over HTTPS, signed as LabRole taken from the node's
# metadata service. That hands this pod the whole role: an accepted limitation of the lab account.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: case-to-summary
spec:
  podSelector:
    matchLabels: {app: case}
  policyTypes: [Egress]
  egress:
    - to: [{ipBlock: {cidr: 0.0.0.0/0, except: [{{ .vpcCidr }}]}}]
      ports: [{protocol: TCP, port: 443}]
    - to: [{ipBlock: {cidr: 169.254.169.254/32}}]
      ports: [{protocol: TCP, port: 80}]
{{- else }}
---
# Replay Job (replay namespace) -> this bank's ingestor, HTTP port only (docs/contracts/deployment.md).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: replay-to-ingestor
spec:
  podSelector:
    matchLabels: {app: ingestor}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: replay}
      ports: [{protocol: TCP, port: 8080}]
{{- end }}
