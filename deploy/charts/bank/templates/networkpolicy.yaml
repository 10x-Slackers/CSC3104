# Deny everything, then allow: traffic inside this bank, DNS, the Kubernetes API, and the platform operators (KEDA reads Kafka lag).
# TODO: narrow to per-service paths and add privacy node <-> other banks (docs/contracts/security.md).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bank-baseline
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [strimzi, cnpg-system, keda]
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        {{- range .Values.apiServerCIDRs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}
---
# Privacy node <-> the other banks' privacy nodes, gRPC port only (docs/contracts/security.md).
# Listing its own namespace changes nothing: the baseline already allows traffic inside the bank.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: privacy-node-peers
spec:
  podSelector:
    matchLabels: {app: privacy-node}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions: [{key: kubernetes.io/metadata.name, operator: In, values: [bank-a, bank-b, bank-c]}]
          podSelector:
            matchLabels: {app: privacy-node}
      ports: [{protocol: TCP, port: 50051}]
  egress:
    - to:
        - namespaceSelector:
            matchExpressions: [{key: kubernetes.io/metadata.name, operator: In, values: [bank-a, bank-b, bank-c]}]
          podSelector:
            matchLabels: {app: privacy-node}
      ports: [{protocol: TCP, port: 50051}]
