# Bank-local Kafka in KRaft mode (Strimzi): one node, or three under the HA flag with a majority of replicas per write.
{{- $aws := get .Values.aws .Values.bank }}
{{- $n := ternary 3 1 .Values.ha }}
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: kafka
  labels:
    strimzi.io/cluster: kafka
spec:
  replicas: {{ $n }}
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 1Gi
        kraftMetadata: shared
  jvmOptions:
    -Xms: 256m
    -Xmx: 512m
  {{- if $aws }}
  template:
    pod:  # EKS: one broker per node, so losing a node keeps a majority (k3d has one node)
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: {matchLabels: {strimzi.io/pool-name: kafka}}
  {{- end }}
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka
spec:
  kafka:
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      {{- if $aws }}
      # The ingestor Lambda's way in from the VPC: fixed node ports per bank (deploy/terraform/lambda.tf), and each
      # broker advertised at its node's private address.
      - name: vpc
        port: 9094
        type: nodeport
        tls: false
        configuration:
          preferredNodePortAddressType: InternalIP
          bootstrap: {nodePort: {{ $aws.kafkaNodePort }}}
          brokers:
            {{- range until $n }}
            - {broker: {{ . }}, nodePort: {{ add $aws.kafkaNodePort 1 . }}}
            {{- end }}
      {{- end }}
    config:
      offsets.topic.replication.factor: {{ $n }}
      transaction.state.log.replication.factor: {{ $n }}
      transaction.state.log.min.isr: {{ min $n 2 }}
      default.replication.factor: {{ $n }}
      min.insync.replicas: {{ min $n 2 }}
      auto.create.topics.enable: false
  entityOperator:
    topicOperator: {jvmOptions: {"-Xmx": 128m}}
---
# Declared rather than auto-created: 6 partitions keyed by account, so up to 6 scorer replicas each own
# some; kept forever, since Kafka is the source of truth and Valkey is rebuilt from it.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: transactions
  labels:
    strimzi.io/cluster: kafka
spec:
  topicName: bank-{{ .Values.bank }}-transactions
  partitions: 6
  config:
    retention.ms: -1
