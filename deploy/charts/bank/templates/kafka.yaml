# The bank's Kafka (Strimzi, KRaft mode): the log every other piece of state is derived from.
# One broker, or three with `ha`: then a write needs two in-sync replicas (acks=all with
# min.insync.replicas 2), so losing one broker loses nothing and stops nothing.
{{- $n := ternary 3 1 .Values.ha }}
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: kafka
  labels:
    strimzi.io/cluster: kafka
spec:
  replicas: {{ $n }}
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 1Gi
        kraftMetadata: shared
  jvmOptions:
    -Xms: 256m
    -Xmx: 512m
  {{- if .Values.aws }}
  template:
    pod:  # AWS: one broker per node, so losing a node keeps a majority (k3d has one node)
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: {matchLabels: {strimzi.io/pool-name: kafka}}
  {{- end }}
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka
spec:
  kafka:
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      {{- with .Values.aws }}
      # The ingestor Lambda's way in from the VPC: fixed node ports per bank
      # (deploy/terraform/lambda.tf), each broker advertised at its node's private address.
      - name: vpc
        port: 9094
        type: nodeport
        tls: false
        configuration:
          preferredNodePortAddressType: InternalIP
          bootstrap: {nodePort: {{ .kafkaNodePort }}}
          brokers:
            {{- range until $n }}
            - {broker: {{ . }}, nodePort: {{ add $.Values.aws.kafkaNodePort 1 . }}}
            {{- end }}
      {{- end }}
    config:
      offsets.topic.replication.factor: {{ $n }}
      transaction.state.log.replication.factor: {{ $n }}
      transaction.state.log.min.isr: {{ min $n 2 }}
      default.replication.factor: {{ $n }}
      min.insync.replicas: {{ min $n 2 }}
      auto.create.topics.enable: false
  entityOperator:
    topicOperator: {jvmOptions: {"-Xmx": 128m}}
---
# The bank's one topic, declared rather than auto-created.
# - 6 partitions, keyed by account: up to 6 scorer workers, each owning some accounts.
# - Kept forever: Kafka is the source of truth, and Valkey is rebuilt from it.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: transactions
  labels:
    strimzi.io/cluster: kafka
spec:
  topicName: bank-{{ .Values.bank }}-transactions
  partitions: 6
  config:
    retention.ms: -1
