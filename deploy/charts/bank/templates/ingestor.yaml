# pacs.008 batches in over HTTP, Kafka events out (docs/contracts/deployment.md, Ingestor row).
{{- if not (get .Values.aws .Values.bank) }}  # EKS: the ingestor Lambda instead
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestor
spec:
  selector:
    matchLabels: {app: ingestor}
  template:
    metadata:
      labels: {app: ingestor}
    spec:
      {{- include "bank.pod" . | nindent 6 }}
      containers:
        - name: ingestor
          image: {{ .Values.image.repository }}/ingestor:{{ .Values.image.tag }}
          args: [python, -m, ingestor.app]
          env:
            - {name: INGESTOR_BANK, value: {{ .Values.bank }}}
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: kafka-kafka-bootstrap:9092}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          {{- include "bank.container" . | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ingestor
spec:
  selector: {app: ingestor}
  ports:
    - port: 8080
{{- end }}
