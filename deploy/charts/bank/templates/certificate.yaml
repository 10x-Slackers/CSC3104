# Privacy-node mTLS certificate (server and client), signed by the lab CA. Secret: privacy-node-tls.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: privacy-node
spec:
  secretName: privacy-node-tls
  dnsNames:
    - privacy-node.{{ .Release.Namespace }}.svc
    - privacy-node.{{ .Release.Namespace }}.svc.cluster.local
  uris:
    - spiffe://csc3104/bank/{{ trimPrefix "bank-" .Release.Namespace | upper }}/privacy-node
  usages: [server auth, client auth]
  privateKey:
    rotationPolicy: Always
  issuerRef:
    name: bank-ca
    kind: ClusterIssuer
