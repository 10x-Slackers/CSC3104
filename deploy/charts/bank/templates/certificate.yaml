# The privacy node's mTLS certificate, for both ends of a call (cert-manager renews it).
# Peers check the DNS name when they call this bank. The URI is the bank's identity:
# it is how a node knows which bank is calling (zero trust: mulechain/node/node.py).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: privacy-node
spec:
  secretName: privacy-node-tls
  dnsNames:
    - privacy-node.{{ .Release.Namespace }}.svc
  uris:
    - spiffe://csc3104/bank/{{ .Values.bank }}/privacy-node
  usages: [server auth, client auth]
  issuerRef:
    name: bank-ca
    kind: ClusterIssuer
