# Privacy-node mTLS certificate (server and client), signed by the lab CA. Secret: privacy-node-tls.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: privacy-node
spec:
  secretName: privacy-node-tls
  dnsNames:
    - privacy-node.{{ .Release.Namespace }}.svc
  usages: [server auth, client auth]
  issuerRef:
    name: bank-ca
    kind: ClusterIssuer
