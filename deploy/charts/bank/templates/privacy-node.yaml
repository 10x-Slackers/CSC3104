{{- if .Values.privacyNode.enabled }}
# Role 3 privacy node (docs/contracts/protocol.md). One replica until query state moves to PostgreSQL.
# Needs Secret privacy-node-keys (pair keys + own signing key) and ConfigMap bank-public-keys.
{{- $bank := .Release.Namespace | trimPrefix "bank-" | upper }}
{{- $peers := without (list "A" "B" "C") $bank }}
{{- $v := .Values.privacyNode }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: privacy-node
spec:
  replicas: 1
  selector:
    matchLabels: {app: privacy-node}
  template:
    metadata:
      labels: {app: privacy-node}
    spec:
      containers:
        - name: privacy-node
          image: {{ $v.image }}
          imagePullPolicy: IfNotPresent
          args:
            - --bank={{ $bank }}
            - --port=50051
            - --workload={{ $v.workload }}
            - --key-version={{ $v.keyVersion }}
            - --signing-key=/keys/signing.pem
            - --db=/data/node.db
            - --search
            {{- range $peers }}
            {{- $pair := list $bank . | sortAlpha | join "-" }}
            - --pairwise-key
            - {{ . }}
            - /keys/{{ $pair }}.key
            - --peer
            - {{ . }}
            - privacy-node.bank-{{ lower . }}.svc:50051
            {{- end }}
            {{- range list "A" "B" "C" }}
            - --public-key
            - {{ . }}
            - /public/{{ . }}.pem
            {{- end }}
          ports:
            - {name: grpc, containerPort: 50051}
          readinessProbe:
            tcpSocket: {port: grpc}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: grpc}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: keys, mountPath: /keys, readOnly: true}
            - {name: public, mountPath: /public, readOnly: true}
            - {name: data, mountPath: /data}
      volumes:
        - name: keys
          secret: {secretName: privacy-node-keys}
        - name: public
          configMap: {name: bank-public-keys}
        - name: data
          emptyDir: {}  # M2 only; M3 keeps protocol state in the bank's PostgreSQL
---
apiVersion: v1
kind: Service
metadata:
  name: privacy-node
spec:
  selector: {app: privacy-node}
  ports:
    - {name: grpc, port: 50051, targetPort: grpc}
---
# Privacy node <-> other banks' privacy nodes on the protocol port only (adds to bank-baseline).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: privacy-node-peers
spec:
  podSelector:
    matchLabels: {app: privacy-node}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range $peers }}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: bank-{{ lower . }}}
          podSelector:
            matchLabels: {app: privacy-node}
        {{- end }}
      ports:
        - {protocol: TCP, port: 50051}
  egress:
    - to:
        {{- range $peers }}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: bank-{{ lower . }}}
          podSelector:
            matchLabels: {app: privacy-node}
        {{- end }}
      ports:
        - {protocol: TCP, port: 50051}
{{- end }}
