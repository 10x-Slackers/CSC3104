# Peer-to-peer chain tracing over mTLS (docs/contracts/security.md), reading the scorer's state from Valkey.
# Replicas share the protocol store in the bank's PostgreSQL and split the scorer's hits (docs/contracts/protocol.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: privacy-node
spec:
  replicas: {{ if .Values.ha }}2{{ else }}1{{ end }}
  selector:
    matchLabels: {app: privacy-node}
  template:
    metadata:
      labels: {app: privacy-node}
    spec:
      {{- include "bank.pod" . | nindent 6 }}
      containers:
        - name: privacy-node
          image: {{ .Values.image.repository }}/privacy-node:{{ .Values.image.tag }}
          args:
            - python
            - -m
            - privacy_node.node
            - --bank={{ .Values.bank }}
            - --valkey-url=valkey://valkey:6379
            - --key-directory=/keys
            - --tls-cert=/tls/tls.crt
            - --tls-key=/tls/tls.key
            - --tls-ca=/tls/ca.crt
            - --search
            - --db=$(NODE_DB)
            - --case-url=http://case:8000
            - --health-port=50052
            # a peer may ingest its leg of a transfer seconds after this bank does
            - --ingestion-grace-seconds=60
            {{- range without (list "A" "B" "C") .Values.bank }}
            - --peer
            - {{ . }}
            - privacy-node.bank-{{ lower . }}.svc:50051
            {{- end }}
          env:
            - name: NODE_DB
              valueFrom:
                secretKeyRef: {name: postgres-app, key: uri}
          ports:
            - containerPort: 50051
            - containerPort: 50052
          readinessProbe:
            grpc: {port: 50052}
          volumeMounts:
            - {name: keys, mountPath: /keys}
            - {name: tls, mountPath: /tls}
          {{- include "bank.container" . | nindent 10 }}
      volumes:
        - {{- include "bank.keyVolume" . | nindent 10 }}
        - name: tls
          secret: {secretName: privacy-node-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: privacy-node
spec:
  selector: {app: privacy-node}
  ports:
    - port: 50051
