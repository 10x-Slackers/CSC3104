# Case service: the bank's cases and its analyst page, fed only by its own privacy node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: case
spec:
  selector:
    matchLabels: {app: case}
  template:
    metadata:
      labels: {app: case}
    spec:
      {{- include "bank.pod" . | nindent 6 }}
      containers:
        - name: case
          image: {{ include "bank.image" . }}
          args: [python, -m, mulechain.case.app]
          env:
            - {name: BANK, value: {{ .Values.bank }}}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: postgres-app, key: uri}
            # AWS: the summary Lambda's function URL, signed with the node's role
            - {name: SUMMARY_URL, value: {{ .Values.aws.summaryUrl | default "http://summary:8080/" | quote }}}
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
          {{- include "bank.container" (dict "limit" "256Mi") | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: case
spec:
  selector: {app: case}
  ports:
    - port: 8000
