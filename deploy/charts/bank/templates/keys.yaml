# The bank's own private keys: 64 random bytes per key version, in files 1, 2, ...
# (32 for key agreement, 32 for signing). Made here, inside the bank, and never shared:
# there is no dealer. Peers get only the public halves, from the node's Keys call.
#
# An upgrade keeps the keys the Secret already holds, including ones added by
# `make key-add` during a rotation.
{{- $existing := lookup "v1" "Secret" .Release.Namespace "bank-keys" }}
apiVersion: v1
kind: Secret
metadata:
  name: bank-keys
data:
  {{- if $existing }}
  {{- toYaml $existing.data | nindent 2 }}
  {{- else }}
  "1": {{ randBytes 64 }}
  {{- end }}
