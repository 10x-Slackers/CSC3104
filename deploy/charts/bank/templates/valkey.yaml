# Valkey: the scorer's state, a view of the Kafka log. No persistence on purpose: if it
# is lost, the scorers rebuild it from the topic. On AWS it is the bank's ElastiCache
# instead.
{{- if not .Values.aws }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
spec:
  selector:
    matchLabels: {app: valkey}
  template:
    metadata:
      labels: {app: valkey}
    spec:
      {{- include "bank.pod" . | nindent 6 }}
      containers:
        - name: valkey
          image: valkey/valkey:9.1.3-alpine
          args: [valkey-server, --save, ""]
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket: {port: 6379}
          # six days of one bank's state peaked at 272Mi
          {{- include "bank.container" (dict "request" "256Mi" "limit" "1Gi") | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
spec:
  selector: {app: valkey}
  ports:
    - port: 6379
{{- end }}
