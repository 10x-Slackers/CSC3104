# The scorer's state as a materialised view of Kafka (docs/contracts/streaming.md): no persistence,
# rebuilt from the topic. ElastiCache on EKS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
spec:
  selector:
    matchLabels: {app: valkey}
  template:
    metadata:
      labels: {app: valkey}
    spec:
      {{- include "bank.pod" . | nindent 6 }}
      containers:
        - name: valkey
          image: valkey/valkey:9.1.3-alpine
          args: [valkey-server, --save, ""]
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket: {port: 6379}
          {{- include "bank.container" . | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
spec:
  selector: {app: valkey}
  ports:
    - port: 6379
