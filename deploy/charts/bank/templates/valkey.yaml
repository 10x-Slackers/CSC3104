# The scorer's state as a materialised view of Kafka (docs/contracts/streaming.md): no persistence,
# rebuilt from the topic.
{{- if not (get .Values.aws .Values.bank) }}  # EKS: ElastiCache instead
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
spec:
  selector:
    matchLabels: {app: valkey}
  template:
    metadata:
      labels: {app: valkey}
    spec:
      {{- include "bank.pod" . | nindent 6 }}
      containers:
        - name: valkey
          image: valkey/valkey:9.1.3-alpine
          args: [valkey-server, --save, ""]
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket: {port: 6379}
          # Not the bank's 128Mi: six days of a bank's state outgrew it and was OOM-killed.
          {{- include "bank.container" (dict "request" "256Mi" "limit" "1Gi") | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
spec:
  selector: {app: valkey}
  ports:
    - port: 6379
{{- end }}
