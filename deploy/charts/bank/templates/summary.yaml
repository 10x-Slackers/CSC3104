# Summary service: drafts a case summary for the case service. Stateless and allowed to
# fail (the case service waits two seconds, then shows no draft). On AWS it is a Lambda.
{{- if not .Values.aws }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: summary
spec:
  selector:
    matchLabels: {app: summary}
  template:
    metadata:
      labels: {app: summary}
    spec:
      {{- include "bank.pod" . | nindent 6 }}
      containers:
        - name: summary
          image: {{ include "bank.image" . }}
          args: [python, -m, mulechain.summary]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /, port: 8080}
          {{- include "bank.container" . | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: summary
spec:
  selector: {app: summary}
  ports:
    - port: 8080
{{- end }}
