name: Coursework checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.7"
      - uses: azure/setup-helm@v5
        with:
          version: "v3.19.0"
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: |
          uv run python -m grpc_tools.protoc -Iapps/privacy_node/src --python_out=apps/privacy_node/src --pyi_out=apps/privacy_node/src --grpc_python_out=apps/privacy_node/src apps/privacy_node/src/privacy_node/privacy_node.proto
          git diff --exit-code -- apps/privacy_node/src/privacy_node/privacy_node_pb2.py apps/privacy_node/src/privacy_node/privacy_node_pb2.pyi apps/privacy_node/src/privacy_node/privacy_node_pb2_grpc.py
